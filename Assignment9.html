<!DOCTYPE html>
<html>
<head>
 <title>Quotation and Citation</title>
</head>
<body>
 <h1>Quotation and Citation Elements</h1>
 <h2>Block Quote</h2>
 <blockquote>
 Learning never exhausts the mind.
 </blockquote>
 <h2>Inline Quote</h2>
 <p>My teacher said, <q>Practice makes progress.</q></p>
 <h2>Citation</h2>
 <p>A useful reference book is <cite>Learning HTML</cite>.</p>
 <h2>Abbreviation</h2>
 <p><abbr title="World Wide Web Consortium">W3C</abbr>
 develops web standards.</p>
 <h2>Address</h2>
 <address>
 Written by a WDW student.<br>
 Email: student@example.com
 </address>
</body>
</html>
