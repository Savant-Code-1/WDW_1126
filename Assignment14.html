<!DOCTYPE html>
<html>
<head>
 <title>Nested and Responsive Tables</title>
 <style>
 .table-container {
 width: 100%;
 overflow-x: auto;
 }
 table {
 border-collapse: collapse;
 min-width: 600px;
 }
 th, td {
 border: 1px solid black;
 padding: 8px;
 }
 </style>
</head>
<body>
 <h1>Nested and Responsive Tables</h1>
 <div class="table-container">
 <table>
 <tr>
 <th>Student</th>
 <th>Details</th>
 <th>Course</th>
 </tr>
 <tr>
 <td>Aman</td>
 <td>
 <table>
 <tr>
 <th>City</th>
 <th>Age</th>
 </tr>
 <tr>
 <td>Delhi</td>
 <td>18</td>
 </tr>
 </table>
 </td>
 <td>HTML</td>
 </tr>
 <tr>
 <td>Riya</td>
 <td>Lucknow, 19</td>
 <td>CSS</td>
 </tr>
 </table>
 </div>
</body>
</html>
